submission:
  title: "ScanAssist"

  problem_statement: >
    CT and MRI scanners are critical healthcare systems. When faults occur,
    technologists often need to search manuals, remember troubleshooting procedures,
    or wait for engineer support, increasing downtime and delaying patient care.

  solution_summary: >
    ScanAssist is a safety-first CT/MRI troubleshooting assistant that provides
    guided procedures, risk assessment, severity scoring, analytics dashboards,
    and automated engineer escalation reports.

  key_features:
    - "Smart procedure search"
    - "Interactive troubleshooting checklists"
    - "Risk and severity assessment"
    - "Engineer report generation"
    - "Analytics dashboard"

  tech_stack:
    languages:
      - "Python"

    frameworks:
      - "Streamlit"

    ibm_technologies: []

    databases:
      - "JSON"

    other:
      - "Pandas"
      - "FPDF"
      - "GitHub"

  what_we_are_most_proud_of: >
    ScanAssist transforms static troubleshooting documentation into an
    interactive assistant that helps technologists resolve issues faster
    and generate structured engineer handover reports.

  known_limitations: >
    The current version uses a static JSON knowledge base and rule-based
    recommendations. It is not yet integrated with hospital systems or
    predictive maintenance platforms.