project:
  name: ScanAssist
  tagline: Safety-First CT/MRI Troubleshooting Assistant

team:
  name: ScanAssist
  lead: Parth
  members:
    - Parth

track: AI

problem_statement: >
  CT and MRI scanners are critical healthcare systems.
  When faults occur, technologists often need to search manuals,
  remember troubleshooting procedures, or wait for engineer support,
  increasing downtime and delaying patient care.

solution: >
  ScanAssist provides guided troubleshooting procedures,
  risk assessment, severity scoring, engineer recommendations,
  analytics dashboards, and automated escalation report generation.

repository:
  source_code: src/
  documentation: docs/
  demo: demo/
  presentation: presentation/

technologies:
  languages:
    - Python
  frameworks:
    - Streamlit
  database:
    - JSON
  libraries:
    - Pandas
    - FPDF

features:
  - Smart Procedure Search
  - Safety-First Guidance
  - Interactive Checklists
  - Engineer Report Generation
  - Analytics Dashboard
  - Knowledge Base Management

run:
  install: pip install -r src/requirements.txt
  start: streamlit run src/app.py

demo:
  video: demo/demo-video-link.txt
  live_url: demo/live-demo-url.txt
  screenshots: demo/screenshots/

status: Working Prototype